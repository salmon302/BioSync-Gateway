[alembic]
# Path to migration scripts, relative to the alembic.ini location.
# Using an absolute path via %(here)s ensures Alembic works regardless of CWD
# (e.g., when running tests from the repo root).
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

sqlalchemy.url = postgresql://biosync_user:biosync_secure_password@localhost:5432/biosync

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
