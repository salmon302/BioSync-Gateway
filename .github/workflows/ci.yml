name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: biosync_test
          POSTGRES_USER: biosync_user
          POSTGRES_PASSWORD: biosync_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install backend dependencies
      working-directory: ./middleware
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 mypy

    - name: Lint with flake8
      working-directory: ./middleware
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy
      working-directory: ./middleware
      run: |
        mypy api/ engine/ --ignore-missing-imports

    - name: Run backend tests
      working-directory: ./middleware
      env:
        DATABASE_URL: postgresql://biosync_user:biosync_test_password@localhost:5432/biosync_test
        JWT_SECRET: test-secret
        ENVIRONMENT: test
      run: |
        pytest tests/ -v --cov=api --cov=engine --cov-report=term-missing
        pytest ../tests/unit/ ../tests/integration/ -v --cov=api --cov=engine --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint with ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Type check with TypeScript
      working-directory: ./frontend
      run: npm run typecheck

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test

  # IQ-1: Docker health check (Dockerfile HEALTHCHECK + /health endpoint)
  iq-1-docker-health:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: ./middleware
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Run IQ-1 tests
      working-directory: ./middleware
      run: pytest ../tests/test_iq1_docker_health.py -v

  # IQ-5: pip check (dependency conflict verification)
  iq-5-pip-check:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: ./middleware
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Run IQ-5 tests
      working-directory: ./middleware
      run: pytest ../tests/test_iq5_pip_check.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker-compose build

    - name: Test Docker Compose startup
      run: |
        cp .env.example .env
        docker-compose up -d
        sleep 10
        docker-compose ps
        curl -f http://localhost:8000/api/health || exit 1
        # Performance check - measure response time
        RESPONSE_TIME=$(curl -s -o /dev/null -w '%{time_total}' http://localhost:8000/health)
        echo "Health endpoint response time: ${RESPONSE_TIME}s"
        if (( $(echo "$RESPONSE_TIME > 1.0" | bc -l) )); then
          echo "Warning: Health endpoint slow (${RESPONSE_TIME}s > 1.0s)"
        fi
        docker-compose down

  performance-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./middleware
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark

    - name: Run PQ-5 barcode benchmark
      working-directory: ./middleware
      run: pytest ../tests/performance/test_pq5_barcode_benchmark.py -v -s

    - name: Run performance benchmarks
      working-directory: ./middleware
      run: |
        python -c "
import time
import asyncio
from engine.signal import MultiChannelEMAFilter
from engine.barcode import hamming_distance

# Benchmark EMA filter
filter = MultiChannelEMAFilter()
start = time.perf_counter()
for _ in range(10000):
    filter.filter_observation({'pressure': 100.0, 'flow': 5.0, 'hr': 75.0, 'spo2': 98.0})
ema_time = (time.perf_counter() - start) * 1000
print(f'EMA filter 10k iterations: {ema_time:.2f}ms')

# Benchmark Hamming distance
start = time.perf_counter()
for _ in range(10000):
    hamming_distance('ATCGATCG', 'ATCGATCG')
hamming_time = (time.perf_counter() - start) * 1000
print(f'Hamming distance 10k iterations: {hamming_time:.2f}ms')

print('Performance benchmarks completed')
"
    - name: Run locust smoke test (PQ-1, PQ-2, PQ-6)
      working-directory: ./middleware
      run: |
        pip install locust
        # Start the app in background for locust to target
        # In CI, this runs against the docker-compose stack or a started instance
        python -c "
import sys
sys.path.insert(0, '.')
# Verify locustfile imports correctly
from tests.performance.locustfile import (
    TelemetryIngestUser, WebSocketUser, PulseSimulationUser,
    FHIRCrudUser, AuditVerificationUser,
    NFR_P1_INGESTION_RATE, NFR_P2_FPS_TARGET, NFR_P3_HTTP_P95_MS,
    NFR_P3_WS_P95_MS, NFR_P4_HASH_CHAIN_1M_SECONDS,
    NFR_P5_PULSE_STEP_MS, NFR_P6_CONCURRENT_WS
)
print('Locustfile imports OK')
print(f'NFR-P1: {NFR_P1_INGESTION_RATE} pts/sec')
print(f'NFR-P2: {NFR_P2_FPS_TARGET} fps')
print(f'NFR-P3: {NFR_P3_HTTP_P95_MS}ms / {NFR_P3_WS_P95_MS}ms')
print(f'NFR-P4: {NFR_P4_HASH_CHAIN_1M_SECONDS}s')
print(f'NFR-P5: {NFR_P5_PULSE_STEP_MS}ms')
print(f'NFR-P6: {NFR_P6_CONCURRENT_WS} concurrent WS')
"
      timeout-minutes: 5
