name: Performance Qualification (PQ)

# Runs the HEAVY load/soak tests for PQ-1, PQ-3, and PQ-4.
# Intended for disposable cloud runners / self-hosted runners or a local
# `docker compose` stack. PQ-4 (24h soak) is dispatch-only (not nightly) and
# defaults to a 1h soak in CI; the full SRS-qualifying 24h run uses
# soak_seconds=86400 on a long/self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      pq:
        description: "Which PQ load test to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - pq1
          - pq3
          - pq4
      soak_seconds:
        description: "PQ-4 soak duration in seconds (full SRS run = 86400)"
        required: false
        default: "3600"
        type: string
  # Nightly at 03:17 UTC (avoid top-of-hour contention).
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: pq-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # PQ-1: k6 real-load (50 VUs ramp over ~12 min)
  # ---------------------------------------------------------------------------
  pq1-k6:
    if: >-
      ${{ github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.pq == 'all' || github.event.inputs.pq == 'pq1')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (db + middleware)
        run: |
          cp .env.example .env
          bash nginx/generate-certs.sh
          export COMPOSE_UID=$(id -u) COMPOSE_GID=$(id -g)
          docker-compose up -d db middleware
          # Wait for middleware health (public /api/health).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "stack healthy"; break
            fi
            sleep 3
          done

      - name: Run k6 PQ-1 load test (grafana/k6)
        run: |
          docker run --rm --network host \
            -v "$PWD/tests/performance/k6:/scripts" \
            grafana/k6 run /scripts/pq1_websocket.js \
            -e BASE_URL=http://localhost:8000 \
            -e WS_URL=ws://localhost:8000/api/telemetry/stream \
            -e API_TOKEN="${{ secrets.PQ_API_TOKEN }}" \
            -e PEAK_VUS=50 -e RAMP_MIN=12

      - name: Tear down stack
        if: always()
        run: docker-compose down -v

  # ---------------------------------------------------------------------------
  # PQ-1: real Locust headless run (R8 promotion from smoke-only pointer test)
  # ---------------------------------------------------------------------------
  pq1-locust:
    if: >-
      ${{ github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.pq == 'all' || github.event.inputs.pq == 'pq1')) }}
    runs-on: ubuntu-latest
    env:
      # Must match the gateway's JWT_SECRET so the load-test tokens validate.
      JWT_SECRET: "dev-only-insecure-secret-change-me"
      BIOSYNC_PQ1_BASE_URL: "http://localhost:8000"
      BIOSYNC_PQ1_DURATION: "60"
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (db + middleware)
        run: |
          cp .env.example .env
          bash nginx/generate-certs.sh
          export COMPOSE_UID=$(id -u) COMPOSE_GID=$(id -g)
          docker-compose up -d db middleware
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "stack healthy"; break
            fi
            sleep 3
          done

      - name: Run PQ-1 real Locust run (headless)
        working-directory: ./middleware
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pytest ../tests/performance/test_pq1_locust_run.py -v

      - name: Tear down stack
        if: always()
        run: docker-compose down -v

  # ---------------------------------------------------------------------------
  # PQ-3: 1M-row hash-chain verification (< 60 s, NFR-P4)
  # ---------------------------------------------------------------------------
  pq3-1m:
    if: >-
      ${{ github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.pq == 'all' || github.event.inputs.pq == 'pq3')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack (applies Alembic migrations to DB)
        run: |
          cp .env.example .env
          bash nginx/generate-certs.sh
          export COMPOSE_UID=$(id -u) COMPOSE_GID=$(id -g)
          docker-compose up -d db middleware
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "stack healthy"; break
            fi
            sleep 3
          done

      - name: Run PQ-3 1M-row hash-chain test
        env:
          # The compose db enforces hostssl clientcert=verify-full, so the
          # runner must present a client certificate (generated above).
          BIOSYNC_PQ3_DATABASE_URL: "postgresql://biosync_user:biosync_secure_password@localhost:5432/biosync?sslmode=verify-full&sslrootcert=${{ github.workspace }}/certs/ca.crt&sslcert=${{ github.workspace }}/certs/client.crt&sslkey=${{ github.workspace }}/certs/client.key"
        working-directory: ./middleware
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pytest ../tests/performance/test_pq3_1m_rows.py -v -s

      - name: Tear down stack
        if: always()
        run: docker-compose down -v

  # ---------------------------------------------------------------------------
  # PQ-4: 24h ingest soak (0 deadlocks, <=5% memory growth) — dispatch only
  # ---------------------------------------------------------------------------
  pq4-soak:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.pq == 'all' || github.event.inputs.pq == 'pq4') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack (applies Alembic migrations to DB)
        run: |
          cp .env.example .env
          bash nginx/generate-certs.sh
          export COMPOSE_UID=$(id -u) COMPOSE_GID=$(id -g)
          docker-compose up -d db middleware
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "stack healthy"; break
            fi
            sleep 3
          done

      - name: Run PQ-4 24h ingest soak
        env:
          # Mutual-TLS client cert (generated above) for the dedicated DB.
          BIOSYNC_PQ4_DATABASE_URL: "postgresql://biosync_user:biosync_secure_password@localhost:5432/biosync?sslmode=verify-full&sslrootcert=${{ github.workspace }}/certs/ca.crt&sslcert=${{ github.workspace }}/certs/client.crt&sslkey=${{ github.workspace }}/certs/client.key"
          BIOSYNC_PQ4_SOAK_SECONDS: "${{ github.event.inputs.soak_seconds }}"
        working-directory: ./middleware
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pytest ../tests/performance/test_pq4_ingest_soak.py -v -s

      - name: Tear down stack
        if: always()
        run: docker-compose down -v
