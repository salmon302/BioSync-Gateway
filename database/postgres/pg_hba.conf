# ----------------------------------------------------------------------------
# BioSync-Gateway PostgreSQL client-access policy  (SRS NFR-S5)
# ----------------------------------------------------------------------------
# Enforces mutual-TLS to PostgreSQL: every network connection MUST arrive over
# TLS (hostssl) AND present a client certificate signed by the BioSync CA
# (clientcert=verify-full). Authentication is still by password
# (scram-sha-256) -- the client certificate is an *additional* factor, exactly
# as NFR-S5 requires ("client-cert auth in addition to password").
#
# This file is mounted into the `db` service by docker-compose and copied onto
# PGDATA at container start (see docker-compose.yml `db.command`). Generate the
# CA + server + client certificates with `./nginx/generate-certs.sh`.
#
# For production, replace the self-signed BioSync CA with an enterprise CA and
# inject the certs via Docker secrets / a secrets manager (do NOT commit keys).
# ----------------------------------------------------------------------------

# Local Unix-socket connections (used by init scripts and admin tooling inside
# the container). Trusted because they never leave the container.
local   all             all                                     trust

# Loopback TCP (container-internal health checks, pg_isready, etc.)
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Network connections: TLS required, valid client certificate required,
# password still checked. No plain `host` lines -> non-TLS connections are
# rejected outright (fail-closed, NFR-S5).
hostssl all             all             0.0.0.0/0               scram-sha-256 clientcert=verify-full
hostssl all             all             ::/0                    scram-sha-256 clientcert=verify-full
